<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#120d1c">
<title>Merge & Forge: Idle Legends</title>
<style>
:root{--gold:#f5c451;--vio:#8b5cf6;--bg:#120d1c;--pan:#1e1630;--pan2:#2a1f42;--edge:#4a3a72;--txt:#f1ebff;--mut:#a79ac6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{background:radial-gradient(ellipse at 50% 0,#2b1a4a,var(--bg) 60%);color:var(--txt);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#app{max-width:480px;min-height:100dvh;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom))}
#top{display:flex;gap:6px;align-items:center}
.chip{flex:1;background:linear-gradient(180deg,var(--pan2),var(--pan));border:1px solid var(--edge);border-radius:12px;padding:7px 8px;font-weight:800;font-size:14px;display:flex;gap:5px;align-items:center;white-space:nowrap;box-shadow:inset 0 1px 0 #ffffff18}
.chip b{color:var(--gold)}
#setB{width:42px;height:38px;border-radius:12px;background:linear-gradient(180deg,var(--pan2),var(--pan));border:1px solid var(--edge);font-size:18px}
#arena{position:relative;flex:1;min-height:150px;border-radius:18px;border:1px solid var(--edge);background:radial-gradient(ellipse at 50% 100%,#5a2d0a88,transparent 60%),linear-gradient(180deg,#1b1330,#0f0a1a);overflow:hidden;display:flex;align-items:flex-end;justify-content:space-around;padding:10px 8px 12px}
#arena:before{content:"";position:absolute;left:0;right:0;bottom:0;height:28px;background:linear-gradient(180deg,#2a2036,#150f1f);border-top:2px solid #3b2c57}
.fig{position:relative;text-align:center;z-index:1}
.fig .em{font-size:clamp(46px,15vw,66px);display:block;line-height:1;filter:drop-shadow(0 6px 8px #000a)}
#hw{position:absolute;right:-6px;top:6px;font-size:26px}
#hero.atk .em{animation:lunge .32s ease-out}
@keyframes lunge{40%{transform:translateX(38px) rotate(10deg)}100%{transform:none}}
#mon.hit .em{animation:shake .25s}
@keyframes shake{25%{transform:translateX(7px);filter:brightness(2.2) drop-shadow(0 0 10px #f55)}75%{transform:translateX(-7px)}}
#mon.die .em{animation:die .45s forwards}
@keyframes die{to{transform:scale(.2) rotate(120deg);opacity:0}}
#mon.boss .em{font-size:clamp(56px,18vw,80px)}
#mname{font-size:12px;font-weight:800;color:var(--mut);margin-bottom:3px}
#hpb{width:clamp(90px,30vw,130px);height:12px;border-radius:8px;background:#0008;border:1px solid #000;overflow:hidden;margin:4px auto 0}
#hpf{height:100%;width:100%;background:linear-gradient(180deg,#ff6b6b,#c1121f);transition:width .15s}
#hpt{font-size:11px;font-weight:800;margin-top:2px}
.pop{position:absolute;pointer-events:none;font-weight:900;font-size:18px;text-shadow:0 2px 0 #000,0 0 8px #000;animation:rise 1s ease-out forwards;z-index:5;white-space:nowrap}
.pop.g{color:var(--gold);font-size:20px}.pop.d{color:#fff}.pop.o{color:#9fe3ff}
@keyframes rise{0%{opacity:0;transform:translate(-50%,0) scale(.7)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-64px) scale(1.15)}}
#anvilBox{position:relative;height:104px;display:flex;justify-content:center}
#anvil{width:min(62%,250px);height:100%;background:radial-gradient(ellipse at 50% 95%,#ff8a2a66,transparent 65%);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none}
#anvil svg{width:100%;height:84px;filter:drop-shadow(0 6px 10px #000c)}
#anvil.tap svg{animation:tap .18s}
@keyframes tap{40%{transform:scale(.92) translateY(4px);filter:brightness(1.6) drop-shadow(0 0 18px #ff9a3c)}}
#anvil small{font-size:11px;font-weight:800;color:var(--mut)}
.spark{position:absolute;pointer-events:none;font-size:14px;animation:spk .6s ease-out forwards;z-index:4}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
#info{font-size:12px;font-weight:700;color:var(--mut);text-align:center;line-height:1.4}
#info b{color:var(--gold)}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;touch-action:none;padding:8px;border-radius:16px;background:linear-gradient(180deg,#171024,#0f0a19);border:1px solid var(--edge)}
.cell{position:relative;aspect-ratio:1;border-radius:11px;background:#0d0817;border:1px solid #2c2144;display:grid;place-items:center;font-size:clamp(22px,8vw,36px)}
.cell.has{background:radial-gradient(circle at 50% 35%,hsl(var(--h) 60% 34%),hsl(var(--h) 55% 14%));border-color:hsl(var(--h) 70% 50%);box-shadow:0 0 10px hsl(var(--h) 80% 45% / .35)}
.cell.sel{outline:3px solid var(--gold);box-shadow:0 0 16px var(--gold);transform:scale(1.05);z-index:2}
.cell.src{opacity:.35}
.cell i{position:absolute;left:4px;top:2px;font-style:normal;font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000}
.cell.merge{animation:mg .6s}
@keyframes mg{30%{transform:scale(1.3);box-shadow:0 0 30px 8px var(--gold);filter:brightness(1.8)}}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:99;font-size:44px;filter:drop-shadow(0 8px 10px #000a);will-change:transform}
#btns{display:flex;gap:8px}
.big{flex:1;padding:14px 6px;border-radius:14px;font-weight:900;font-size:15px;line-height:1.2;background:linear-gradient(180deg,#a678ff,#6b3fd4);border:1px solid #c9a8ff;box-shadow:0 4px 0 #3b1f85,0 6px 14px #0008}
.big.gold{background:linear-gradient(180deg,#ffd978,#d99a1c);border-color:#ffe9a8;color:#2b1a00;box-shadow:0 4px 0 #8a5a00,0 6px 14px #0008}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #3b1f85}
.big.off{filter:grayscale(.7) brightness(.7)}
#toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:200}
.toast{background:#000c;border:1px solid var(--gold);color:#fff;padding:8px 14px;border-radius:12px;font-weight:800;font-size:14px;animation:ti .25s,to .3s 1.9s forwards;max-width:92vw;text-align:center}
@keyframes ti{from{opacity:0;transform:translateY(-12px)}}@keyframes to{to{opacity:0}}
#ov{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px;z-index:150}
#ov.show{display:flex}
.box{width:100%;max-width:420px;max-height:88dvh;overflow:auto;background:linear-gradient(180deg,var(--pan2),var(--pan));border:2px solid var(--edge);border-radius:20px;padding:16px;box-shadow:0 0 40px #8b5cf655;animation:ti .25s}
.box h2{font-size:19px;margin-bottom:10px;text-align:center;color:var(--gold)}
.box p{text-align:center;color:var(--mut);font-weight:700;margin-bottom:12px;line-height:1.4}
.row{display:flex;gap:8px;align-items:center;padding:10px;margin-bottom:8px;background:#0006;border:1px solid #3a2d5a;border-radius:14px}
.row .t{flex:1;font-size:13px;color:var(--mut);font-weight:700}.row .t b{display:block;color:#fff;font-size:15px}
.row button{min-width:92px;padding:10px 6px;border-radius:11px;font-weight:900;background:linear-gradient(180deg,#ffd978,#d99a1c);color:#2b1a00}
.row button.off{filter:grayscale(.8) brightness(.7)}
.close{width:100%;margin-top:4px;padding:12px;border-radius:12px;background:#3a2d5a;font-weight:800}
.danger{background:linear-gradient(180deg,#e5484d,#a1171c)!important;color:#fff!important}
.idle{font-size:34px;text-align:center;color:var(--gold);font-weight:900;margin:6px 0 12px}

#wbar{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gold)}#wbar b{flex:1}
.pip{width:14px;height:8px;border-radius:5px;background:#3a2d5a}.pip.d{background:var(--gold)}.pip.c{background:#fff;box-shadow:0 0 8px #fff}.pip.bs{width:22px;border:1px solid #e5484d}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:24px;font-weight:900;color:#ffd978;text-shadow:0 0 18px #e5484d,0 3px 0 #000;opacity:0;pointer-events:none;z-index:8}
#banner.go{animation:ban 1.8s ease-out}@keyframes ban{0%{opacity:0;transform:scale(2)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#hpb.bossbar{width:clamp(120px,44vw,190px);height:16px;border-color:#ffd978;box-shadow:0 0 12px #e5484d}
#hpb.bossbar #hpf{background:linear-gradient(180deg,#ffd978,#e5484d)}
#tools{display:flex;gap:6px}.tl{flex:1;padding:8px 2px;border-radius:12px;background:linear-gradient(180deg,var(--pan2),var(--pan));border:1px solid var(--edge);font-size:20px;display:flex;flex-direction:column;align-items:center;gap:1px}.tl span{font-size:10px;font-weight:800;color:var(--mut)}.tl:active{transform:translateY(2px)}
.cell.has{border:2px solid var(--rc);box-shadow:0 0 8px color-mix(in srgb,var(--rc) 45%,transparent)}
.cell b{position:absolute;right:3px;bottom:1px;font-size:11px}
.cell.r3,.cell.r4{animation:pulse 2.2s infinite}.cell.r5,.cell.r6{animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 18px 3px var(--rc)}}
.cell.t7{background:radial-gradient(circle at 50% 35%,#4b1d7a,#05010a)}.cell.t8{background:radial-gradient(circle at 50% 35%,#7a5a10,#2a1c02)}.cell.t9{background:radial-gradient(circle at 50% 35%,#fff3a0,#a86b00)}
.cell.god{animation:rb 3s linear infinite;box-shadow:0 0 20px 4px #fff3a0}@keyframes rb{to{filter:hue-rotate(360deg) brightness(1.2)}}
.celeb{text-align:center}.bigw{font-size:90px;animation:bw 1.2s ease-out;filter:drop-shadow(0 0 24px var(--rc))}@keyframes bw{0%{transform:scale(.2) rotate(-90deg);opacity:0}60%{transform:scale(1.3) rotate(10deg)}100%{transform:none;opacity:1}}
.row button br+*{font-size:12px}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="chip">🪙<b id="gold">0</b></div>
    <div class="chip">⛏️<b id="ore">0</b></div>
    <div class="chip">🔨 Ур.<b id="fl">1</b></div>
    <button id="setB" aria-label="Настройки">⚙️</button>
  </header>
  <div id="wbar"></div>
  <section id="arena">
    <div id="banner"></div>
    <div class="fig" id="hero"><span class="em">🦸</span><span id="hw"></span></div>
    <div class="fig" id="mon"><div id="mname"></div><span class="em" id="memo"></span><div id="hpb"><div id="hpf"></div></div><div id="hpt"></div></div>
  </section>
  <section id="anvilBox">
    <div id="anvil">
      <svg viewBox="0 0 200 110"><defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b4bccd"/><stop offset=".5" stop-color="#6a7186"/><stop offset="1" stop-color="#2b2f3e"/></linearGradient></defs>
      <path d="M8 30Q48 20 70 28H172Q166 54 130 60L128 80H152L160 102H44L52 80H76L74 60Q38 56 8 30Z" fill="url(#mg)" stroke="#14151d" stroke-width="3" stroke-linejoin="round"/>
      <path d="M72 30H170" stroke="#e8ecf7" stroke-width="3" opacity=".75" stroke-linecap="round"/></svg>
      <small id="aLbl">Нажимай на наковальню!</small>
    </div>
  </section>
  <div id="info"></div>
  <section id="grid"></section>
  <div id="btns">
    <button class="big" id="craft">🔨 Создать оружие</button>
    <button class="big gold" id="upB">⚒️ Улучшения</button>
  </div>
  <div id="tools">
    <button class="tl" id="mapB">🗺️<span>Мир</span></button>
    <button class="tl" id="amB">🔀<span>Авто</span></button>
    <button class="tl" id="soB">⇅<span>Сорт.</span></button>
    <button class="tl" id="qB">📜<span>Задания</span></button>
    <button class="tl" id="prB">👑<span>Престиж</span></button>
  </div>
</div>
<div id="toasts"></div>
<div id="ov"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),KEY='mergeForgeIdleV2',OLD='mergeForgeIdleV1',CELLS=20,CAP=8*3600,MAXL=100;
/* ===== ДАННЫЕ ===== */
const TIER=['ржавчины','железа','магии','пламени','льда','кристалла','древних','пустоты','легенд','богов'];
const TYPE=['Кинжал','Меч','Топор','Копьё','Молот','Лук','Посох','Клинок','Секира','Рапира'];
const TE=['🗡️','⚔️','🪓','🔱','🔨','🏹','🪄','🛡️','⚒️','🔪'],TB=['','🔩','✨','🔥','❄️','💎','🏺','🌀','👑','🌟'],TH=[30,210,265,18,195,300,45,275,50,330];
const RAR=[['Обычное','#9aa3b5'],['Необычное','#4ade80'],['Редкое','#4aa3ff'],['Эпическое','#b36bff'],['Легендарное','#ffb02e'],['Мифическое','#ff4d6d'],['Божественное','#fff3a0']];
const rar=l=>Math.min(6,Math.floor((l-1)/15));
const W=l=>{const t=Math.floor((l-1)/10),k=(l-1)%10,r=rar(l);return l===MAXL?{n:'Око Творца',e:'🌌',b:'🌟',t:9,r:6,h:330,p:Math.round(3*Math.pow(2.2,99)*2.5)}:{n:TYPE[k]+' '+TIER[t],e:TE[k],b:TB[t],t,r,h:TH[t],p:Math.round(3*Math.pow(2.2,l-1)*(1+.25*r))}};
const MT=[['Железо','🔩'],['Серебро','🥈'],['Золотая руда','🟨'],['Кристаллы','💎'],['Древние осколки','🏺'],['Божественная пыль','✨']];
const WD=[
['Забытые земли','#1b2b1a','#0d160c',[['🐀','Крыса'],['🦇','Летучая мышь'],['🐺','Волк'],['🕷️','Паук'],['🐍','Змей']],['🗿','Каменный голем'],0],
['Железные пустоши','#3a2a22','#150d0a',[['🤖','Ржавый робот'],['🦂','Скорпион'],['🐗','Кабан-мутант'],['🧟','Зомби'],['👺','Гоблин']],['🦾','Железный колосс'],0],
['Лес древних духов','#12301f','#06140c',[['🍄','Гриб-споровик'],['🦉','Сова духов'],['🌳','Энт'],['🧚','Лесная ведьма'],['🦌','Дух оленя']],['🌲','Древний страж'],1],
['Пылающий вулкан','#4a1608','#170603',[['🔥','Огненный элементаль'],['🦎','Саламандра'],['👹','Огр'],['🌋','Лавовый слизень'],['😈','Бес']],['🐉','Огненный дракон'],1],
['Ледяное королевство','#10304a','#050f1c',[['🐧','Ледяной пингвин'],['🐻‍❄️','Белый медведь'],['⛄','Снеговик-воин'],['🥶','Ледяной призрак'],['🐺','Снежный волк']],['🤴','Ледяной король'],2],
['Кристальные пещеры','#2d1b4d','#0f0820',[['🦠','Кристальная слизь'],['🦇','Пещерный нетопырь'],['🐛','Гранитный червь'],['👾','Дух кристалла'],['🕷️','Пещерный паук']],['💠','Кристальный страж'],3],
['Проклятые руины','#2a1038','#0d0314',[['💀','Скелет'],['👻','Призрак'],['🧛','Вампир'],['🧟','Проклятый рыцарь'],['🪦','Страж могил']],['☠️','Король-лич'],3],
['Небесные острова','#1d3a66','#0a1530',[['🦅','Громовой орёл'],['🐲','Небесный змей'],['🧞','Джинн'],['☁️','Грозовое облако'],['🦄','Дикий единорог']],['⚡','Громовой феникс'],4],
['Бездонная тьма','#12031f','#020006',[['🌑','Тень бездны'],['🐙','Кракен тьмы'],['🦑','Пожиратель'],['😶‍🌫️','Безликий'],['🕳️','Разрыв пустоты']],['👁️','Повелитель пустоты'],4],
['Божественный мир','#4a3a10','#1a1204',[['😇','Падший ангел'],['🦁','Небесный лев'],['🛐','Страж врат'],['🔱','Страж трона'],['🌠','Звёздный дух']],['👼','Хранитель вечности'],5]];
const UPS={ore:{n:'Мощный удар',d:'+1 базовая руда за касание',b:40,g:1.5,max:40,m:0},disc:{n:'Экономный кузнец',d:'−7% к цене оружия',b:60,g:1.6,max:25,m:1},dmg:{n:'Сила героя',d:'+20% урона героя',b:50,g:1.55,max:60,m:0},spd:{n:'Ярость боя',d:'Атаки быстрее на 8%',b:100,g:1.7,max:20,m:1},gold:{n:'Увеличение добычи',d:'+12% золота и руды',b:80,g:1.55,max:40,m:2},mat:{n:'Редкий материал',d:'+2% шанс выпадения, +3% шанс редкого',b:150,g:1.6,max:20,m:3},boss:{n:'Трофеи босса',d:'+20% награды и материалов с боссов',b:200,g:1.6,max:25,m:4},start:{n:'Мастерство кузнеца',d:'+1 уровень создаваемого оружия',b:500,g:2.2,max:30,m:3},crit:{n:'Критический удар',d:'+2% шанс крита (урон ×3)',b:120,g:1.6,max:25,m:1},auto:{n:'Автоковка',d:'Сама создаёт оружие. Каждый уровень быстрее на 1 с',b:300,g:1.8,max:12,m:2}};
const PU=[['pd','Сила легенды','+15% урона',3,1.9,30],['pg','Золото легенды','+15% золота',3,1.9,30],['pk','Закалённый старт','+1 уровень создаваемого оружия навсегда',8,2.4,8],['pw','Быстрый старт','+2 открытых мира после престижа',10,3,4]];
const RC=[['Клинок кузнеца',0,22,40,8],['Серебряный страж',1,22,80,18],['Кристальное лезвие',3,30,150,36],['Осколок древних',4,38,300,58],['Дар небес',5,45,600,82]];
const Q=[['c10','Создай 10 предметов','craft',10,15,0,5],['m5','Объедини 5 предметов','merge',5,15,0,5],['k20','Победи 20 монстров','kill',20,20,0,6],['u3','Улучши кузницу 3 раза','ups',3,20,0,6],['b1','Победи первого босса','boss',1,40,1,5],['e1','Получи оружие «Эпическое»','epic',1,200,3,10],['k500','Победи 500 монстров','kill',500,200,2,15],['b5','Победи 5 боссов','boss',5,150,4,10],['d1','Ежедневно: победи 30 монстров','kill',30,20,0,4,1],['d2','Ежедневно: создай 15 предметов','craft',15,15,0,3,1],['d3','Ежедневно: объедини 10 предметов','merge',10,15,0,3,1]];
const def=()=>({gold:0,ore:0,xp:0,grid:Array(CELLS).fill(0),up:Object.fromEntries(Object.keys(UPS).map(k=>[k,0])),mats:[0,0,0,0,0,0],w:0,st:1,mw:0,maxG:0,hp:0,lp:0,lpAll:0,pu:{pd:0,pg:0,pk:0,pw:0},t:Date.now(),snd:true,prot:25,rar:0,sk:{},qc:[],daily:{d:'',s:{},c:[]}});
function load(){
  const d=def(),n=x=>Number.isFinite(+x)?+x:0,cp=(v,a,b)=>Math.max(a,Math.min(b,Math.floor(n(v))));let o=null,old=false;
  try{o=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!o){try{o=JSON.parse(localStorage.getItem(OLD));old=!!o}catch(e){}}
  if(o&&typeof o==='object'){
    d.gold=Math.max(0,n(o.gold));d.ore=Math.max(0,n(o.ore));d.xp=Math.max(0,n(o.xp));d.t=n(o.t)||Date.now();d.snd=o.snd!==false;

    +'<button class="close" data-act="prest" style="background:linear-gradient(180deg,#a678ff,#6b3fd4);'+(gain?'':'filter:grayscale(.7)')+'">Новое путешествие · '+(gain?'+'+gain+' 👑':'нужен 4-й мир')+'</button><button class="close" data-act="close">Закрыть</button>')}
function openSettings(){modal('<h2>⚙️ Настройки</h2><div class="row"><div class="t"><b>Звук</b>Звуковые эффекты</div><button data-act="snd">'+(S.snd?'Вкл':'Выкл')+'</button></div><div class="row"><div class="t"><b>Защита слияния</b>Подтверждение и защита от авто-слияния с ур. '+S.prot+'</div><button data-act="prot">Ур. '+S.prot+'</button></div><div class="row"><div class="t"><b>Сброс прогресса</b>Удалит всё, включая престиж</div><button class="danger" data-act="reset">Сбросить</button></div><button class="close" data-act="close">Закрыть</button>')}
function doPrestige(){const g=lpGain();if(g<1)return;S.lp+=g;S.lpAll+=g;S.gold=0;S.ore=0;S.mats=[0,0,0,0,0,0];S.grid=Array(CELLS).fill(0);for(const k in S.up)S.up[k]=0;
  S.mw=Math.min(9,S.pu.pw*2);S.w=S.mw;S.st=1;S.maxG=S.mw*6;sel=-1;busy=false;spawn(true);renderGrid();closeModal();toast('👑 Новое путешествие! Получено очков легенды: '+g);save()}
$('setB').onclick=openSettings;$('upB').onclick=openUp;$('mapB').onclick=openMap;$('qB').onclick=openQuests;$('prB').onclick=openPrestige;$('amB').onclick=autoMerge;$('soB').onclick=sortGrid;
$('ov').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'),a=b&&b.dataset.act,D=b&&b.dataset;
  if(!b){if(e.target===$('ov')&&$('ov').dataset.c)closeModal();return}
  if(a==='close')closeModal();
  else if(a==='snd'){S.snd=!S.snd;save();openSettings()}
  else if(a==='prot'){const o=[10,25,40,60,100],i=o.indexOf(S.prot);S.prot=o[(i+1)%o.length];save();openSettings()}
  else if(a==='mergeYes'){closeModal();tryMove(+D.a,+D.b,true)}
  else if(a==='reset')modal('<h2>Сбросить ВЕСЬ прогресс?</h2><p>Будут удалены золото, руда, оружие, материалы, улучшения и очки престижа. Отменить нельзя.</p><div class="row" style="background:none;border:0;padding:0"><button class="close" data-act="close" style="margin:0">Отмена</button><button class="close danger" data-act="resetYes" style="margin:0">Да, сбросить</button></div>');
  else if(a==='resetYes'){try{localStorage.removeItem(KEY);localStorage.removeItem(OLD)}catch(e){}S=def();sel=-1;busy=false;spawn(true);renderGrid();closeModal();toast('Прогресс сброшен')}
  else if(a==='buy'){const k=D.k,u=UPS[k],c=upCost(k),mq=upMat(k);
    if(S.up[k]>=u.max)toast('Максимальный уровень улучшения');
    else if(S.gold<c){toast('Не хватает золота: '+fmt(c)+' 🪙');sfx(120,.15,'sawtooth')}
    else if(!matHave(u.m,mq)){toast('Не хватает: '+MT[u.m][0]+' ('+fmt(mq)+')'+(u.m>=1?' — добывайте в дальних мирах':''));sfx(120,.15,'sawtooth')}
    else{S.gold-=c;S.mats[u.m]-=mq;S.up[k]++;bump('ups');sfx(600,.15);toast('Улучшено: '+u.n+' (ур. '+S.up[k]+')');save()}
    ui();openUp()}
  else if(a==='rc'){const r=RC[+D.i],gc=goldOf(G(),false)*r[3]*5;
    if(S.gold<gc||!matHave(r[1],r[2]))toast('Не хватает золота или материалов');
    else if(!give(r[4]))toast('Нет места в сетке — освободите ячейку');
    else{S.gold-=gc;S.mats[r[1]]-=r[2];renderGrid();toast('Выковано: '+W(r[4]).n+' (ур. '+r[4]+')');sfx(700,.25);save()}
    ui();if($('ov').classList.contains('show')&&!$('ov').querySelector('.celeb'))openUp()}
  else if(a==='goW'){S.w=+D.i;S.st=1;busy=false;spawn(true);ui();closeModal();toast('Мир: '+WD[S.w][0]);save()}
  else if(a==='claim'){const q=Q.find(x=>x[0]===D.id);if(q&&!qDone(q)&&qProg(q)>=q[3]){const g=goldOf(G(),false)*q[4];S.gold+=g;S.mats[q[5]]+=q[6];S.xp+=5;(q[7]?S.daily.c:S.qc).push(q[0]);sfx(700,.2);toast('Награда: +'+fmt(g)+' 🪙 +'+q[6]+MT[q[5]][1]);save();ui()}openQuests()}
  else if(a==='buyP'){const p=PU.find(x=>x[0]===D.k),lv=S.pu[p[0]],c=Math.round(p[3]*Math.pow(p[4],lv));if(lv>=p[5]||S.lp<c)toast('Не хватает очков легенды');else{S.lp-=c;S.pu[p[0]]++;sfx(700,.2);toast('Куплено: '+p[1]);save();ui()}openPrestige()}
  else if(a==='prest'){const g=lpGain();if(g<1){toast('Престиж откроется, когда вы достигнете 4-го мира');return}
    modal('<h2>Начать новое путешествие?</h2><p><b>Вы получите:</b> '+g+' 👑 очков легенды (+3% урона и золота за каждое, плюс постоянные улучшения).</p><p><b>Будет потеряно:</b> золото, руда, материалы, всё оружие в сетке, улучшения кузницы и прогресс по мирам (откроется миров: '+(Math.min(9,S.pu.pw*2)+1)+').</p><p><b>Сохранится:</b> очки легенды и их улучшения, уровень кузницы, задания, рекорды редкости.</p><div class="row" style="background:none;border:0;padding:0"><button class="close" data-act="close" style="margin:0">Отмена</button><button class="close" data-act="prestYes" style="margin:0;background:linear-gradient(180deg,#a678ff,#6b3fd4)">Начать</button></div>')}
  else if(a==='prestYes')doPrestige();
});
/* ===== СОХРАНЕНИЕ И IDLE ===== */
function save(force){if(force||!document.hidden)S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function checkIdle(){
  const sec=(Date.now()-S.t)/1000;
  if(sec>=60){const t=Math.min(sec,CAP),st=Math.min(S.st,5),g=S.w*6+st-1,ttk=Math.ceil(hpOf(g,false)/dmg())*atkMs()/1000+.5,k=t/ttk*.35,mi=WD[S.w][5],
      gg=Math.floor(k*goldOf(g,false)),oo=Math.floor(k*oreOf(g)),mq=Math.floor(k*(.14+.02*S.up.mat)*(1+Math.floor(S.w/2))),h=Math.floor(t/3600),mm=Math.floor(t%3600/60);
    if(gg>0){S.gold+=gg;S.ore+=oo;S.mats[mi]+=mq;S.hp=Math.min(S.hp,hpOf(G(),isBoss()));
      modal('<h2>🌙 С возвращением!</h2><p>Пока вас не было, ваш герой продолжал сражаться!</p><div class="idle">+'+fmt(gg)+' 🪙</div><p>⛏️ +'+fmt(oo)+(mq?' · '+MT[mi][1]+' +'+fmt(mq):'')+'<br>Время отсутствия: '+(h?h+' ч ':'')+mm+' мин'+(sec>CAP?' (максимум 8 ч)':'')+'</p><button class="close" data-act="close" style="background:linear-gradient(180deg,#ffd978,#d99a1c);color:#2b1a00">Забрать</button>',false);sfx(700,.2)}}
  S.t=Date.now();save();renderGrid()}
setInterval(save,3000);
addEventListener('pagehide',()=>save(true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)save(true);else{acc=0;checkIdle()}});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
/* ===== СТАРТ ===== */
S.rar=Math.max(S.rar,rar(Math.max(1,best())));if(!best())S.rar=Math.max(0,S.rar);
dd();if(S.hp<=0||S.hp>hpOf(G(),isBoss()))S.hp=hpOf(G(),isBoss());
drawMon();renderGrid();checkIdle();
</script>
</body>
